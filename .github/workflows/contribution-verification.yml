name: Contribution verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Item detail on Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DJANGO_SECRET_KEY: public-offline-test-key-no-production-use
      DATABASE_URL: sqlite:///:memory:
    steps:
      - name: Check out the exact contribution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba8409a8715594373d654339995331f759abf82c
          persist-credentials: false
      - name: Set up the documented Python baseline
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the documented dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the Django system checks
        run: python manage.py check
      - name: Run the full test suite
        run: python manage.py test --verbosity 2
